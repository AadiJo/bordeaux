name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run shadow:optimizer
        env:
          # Hosted runners are slower and noisier than the reference-machine gate.
          BORDEAUX_SHADOW_COMMON_P95_LIMIT_MS: "75"
          BORDEAUX_SHADOW_STRESS_P95_LIMIT_MS: "150"
      - run: npm run test:java-integration:built
      - run: npm audit --audit-level=high
      - name: Configure Electron sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm run test:smoke:built
